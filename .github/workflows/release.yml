name: Release

on:
  push:
    tags:
      - "**"
      - "!**[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      database_mcp_published: ${{ steps.database_mcp.outputs.published }}
      database_mcp_version: ${{ steps.database_mcp.outputs.version }}
    steps:
      - name: Verify stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ [0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "Prerelease tags are handled manually."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run quality
      - name: Publish tagged packages to npm with trusted publishing
        id: database_mcp
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync, spawnSync } = require("node:child_process");
          // Publish workspace dependencies before their dependants.
          const directories = ["query-builder", "query-formatter", "database", "database-mcp"];
          const packages = directories.map((directory) => ({
            directory: `packages/${directory}`,
            ...JSON.parse(fs.readFileSync(`packages/${directory}/package.json`, "utf8")),
          }));
          const tag = process.env.RELEASE_TAG;
          const stablePackages = packages.filter((pkg) => !pkg.version.split("+")[0].includes("-"));
          const selected = tag.startsWith("@")
            ? stablePackages.filter((pkg) => tag === `${pkg.name}@${pkg.version}`)
            : stablePackages;
          if (!selected.length || (!tag.startsWith("@") && !/^v?\d+\.\d+\.\d+(?:\+[0-9A-Za-z.-]+)?$/.test(tag))) {
            throw new Error(`Tag ${tag} must be a version or match a workspace package and version`);
          }
          for (const pkg of selected) {
            const result = spawnSync("npm", ["view", `${pkg.name}@${pkg.version}`, "version", "--json", "--registry", "https://registry.npmjs.org"], { encoding: "utf8" });
            if (result.status === 0) {
              console.log(`Skipping already published ${pkg.name}@${pkg.version}`);
              continue;
            }
            let code;
            try { code = JSON.parse(result.stdout).error?.code; } catch {}
            if (code !== "E404") {
              throw new Error(result.stderr || result.error?.message || "Unable to check npm package version");
            }
            execFileSync("npm", ["publish", "--access", "public", "--tag", "latest", "--registry", "https://registry.npmjs.org"], {
              cwd: pkg.directory,
              stdio: "inherit",
            });
          }
          const mcp = selected.find((pkg) => pkg.name === "@ngandu-dev/database-mcp");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `published=${Boolean(mcp)}\nversion=${mcp?.version ?? ""}\n`);
          NODE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi

  database-mcp-native:
    needs: release
    if: needs.release.outputs.database_mcp_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            executable: ngandu-database-mcp
          - runner: macos-15-intel
            platform: macos
            arch: x64
            executable: ngandu-database-mcp
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            executable: ngandu-database-mcp
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            executable: ngandu-database-mcp
          - runner: windows-2025
            platform: windows
            arch: x64
            executable: ngandu-database-mcp.exe
    runs-on: ${{ matrix.runner }}
    env:
      MCP_VERSION: ${{ needs.release.outputs.database_mcp_version }}
      MCP_EXECUTABLE: packages/database-mcp/dist/bin/${{ matrix.executable }}
      MCP_ARCHIVE: ngandu-database-mcp-v${{ needs.release.outputs.database_mcp_version }}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Compile native executable
        shell: bash
        env:
          MCP_BINARY_OUTFILE: dist/bin/${{ matrix.executable }}
        run: bun run --filter @ngandu-dev/database-mcp compile
      - name: Smoke native executable
        shell: bash
        run: |
          "${MCP_EXECUTABLE}" --version | grep -Fx "${MCP_VERSION}"
          "${MCP_EXECUTABLE}" --help
          bun packages/database-mcp/scripts/smoke-binary.ts "${MCP_EXECUTABLE}"
      - name: Archive native executable
        shell: bash
        run: tar -czf "${MCP_ARCHIVE}" -C packages/database-mcp/dist/bin "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v6
        with:
          name: database-mcp-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.MCP_ARCHIVE }}
          if-no-files-found: error

  database-mcp-release-assets:
    needs: [release, database-mcp-native]
    if: needs.release.outputs.database_mcp_published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: database-mcp-*
          merge-multiple: true
          path: artifacts
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Attach assets to the tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          artifacts/*.tar.gz artifacts/SHA256SUMS --clobber
